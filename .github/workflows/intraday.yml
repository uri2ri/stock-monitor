name: Intraday Breakout Watch

# 야간 스캔이 뽑은 돌파 임박 종목이 장중에 실제로 20일 고가를 넘으면
# 카톡으로 알린다. 노션·메일에 쓰지 않는다.

# [비활성] 스케줄을 끈다 - auto-trade.yml로 일원화했다.
#
# 이 워크플로와 auto-trade.yml은 같은 intraday_watch.py를 돌리고 같은
# alerted_*.json으로 중복 알림을 막는다. 그래서 둘 다 켜두면 먼저 도는
# 쪽이 돌파 신호를 "이미 알림"으로 기록해버리고, 나중 실행은 그 종목을
# 감시 대상에서 빼버린다. 이 워크플로엔 KIS 자격증명이 없어 매수를 못
# 하는데, 여기가 먼저 이기면 자동매수가 통째로 건너뛰어진다
# (2026-08-19 14:10 위더스제약 - 진입가능인데 매수 안 됨).
#
# auto-trade.yml이 이 워크플로가 하던 일(돌파 감시 + 카톡)을 그대로
# 하면서 자동매매까지 하고, GitHub 스케줄보다 정확한 cron-job.org로
# 돈다. 그래서 여기 스케줄만 끈다.
#
# 되살리려면 아래 schedule 주석을 풀고 auto-trade.yml 쪽 트리거를 멈출 것.
# 둘을 동시에 켜면 같은 경합이 다시 생긴다.
on:
  # schedule:
  #   - cron: "3,13,23,33,43,53 0-6 * * 1-5"
  workflow_dispatch:

# 알림 이력(data/alerted_*.json)을 커밋하므로 겹쳐 돌면 안 된다.
# 진행 중인 실행을 취소하지 않는다 – 카톡을 보낸 뒤 이력을 커밋하기
# 전에 잘리면 그 종목을 다음 실행이 또 알린다. 타임아웃(8분)이 스케줄
# 간격(10분)보다 짧아 어차피 겹치지 않는다.
concurrency:
  group: intraday
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    # 100종목을 20개씩 5배치로 받는다. 다음 스케줄(10분)을 넘기지 않게
    # 짧게 끊는다 – 넘기면 concurrency가 다음 실행을 지운다.
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Watch for breakouts
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          TOTAL_CAPITAL: ${{ secrets.TOTAL_CAPITAL }}
          # 워치리스트 거리 상한 (×ATR). 없으면 1.0
          WATCH_THRESHOLD: ${{ vars.WATCH_THRESHOLD }}
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: python intraday_watch.py

      # 알림 이력만 커밋한다. 다음 실행이 이 파일을 읽어 중복 발송을 막는다.
      # 시세 캐시(parquet)는 이 워크플로가 건드리지 않는다.
      - name: Commit alert log
        if: success()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 알림이 없으면 파일도 없다 – glob이 안 맞아도 넘어간다
          git add data/alerted_*.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "새 알림 없음 – 커밋하지 않습니다."
            exit 0
          fi
          git commit -m "chore(intraday): 돌파 알림 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') [skip ci]"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
